<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <script>
        // Fetch and store the Google token in sessionStorage
        async function storeGoogleToken() {
            try {
                const response = await fetch('/posts/api/get-google-token/');
                if (!response.ok) throw new Error('Failed to fetch token');

                const data = await response.json();
                sessionStorage.setItem('googleAccessToken', data.access_token);
                sessionStorage.setItem('currentUsername', "{{ user.username }}");
                console.log('Google token stored:', data.access_token);
            } catch (error) {
                console.error('Error fetching Google token:', error);
            }
        }

        // Helper function to call APIs with the Google token
        async function callApi(endpoint, outputElementId) {
            const token = sessionStorage.getItem('googleAccessToken');
            if (!token) {
                console.error('No Google access token available');
                alert('Please log in to access this feature.');
                return;
            }

            try {
                const response = await fetch(endpoint, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                });

                if (!response.ok) throw new Error('Access denied or invalid token.');

                const data = await response.json();
                console.log(`API Response from ${endpoint}:`, data);

                // Display the API response on the page
                document.getElementById(outputElementId).textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                console.error(`Error accessing ${endpoint}:`, error);
                alert(`Error accessing ${endpoint}`);
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            const isAuthenticated = "{{ user.is_authenticated|lower }}" === "true";
            if (isAuthenticated) {
                storeGoogleToken();
            }
        });
    </script>
</head>

<body>
    <h1>Welcome to the Dashboard</h1>

    <!-- Button to call the Protected API -->
    <button onclick="callApi('/posts/pv/', 'api-response')">Access Protected View</button>

    <!-- Button to fetch the list of users -->
    <button onclick="window.location.href='/posts/user-list/'">Go to User List</button>

    <button onclick="location.href='/posts/feed/'">Go to Post Page</button>
    
    <!-- Display API Responses -->
    <h2>Protected API Response:</h2>
    <pre id="api-response">API Response will appear here...</pre>

    <h2>User List Response:</h2>
    <pre id="user-list-response">User list will appear here...</pre>
    

    <a href="/accounts/logout/">Logout</a>
</body>

</html>
